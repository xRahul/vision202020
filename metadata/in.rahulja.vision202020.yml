AutoName: Vision 20-20-20
Summary: Prevent digital eye strain with the 20-20-20 rule. 100% offline.
Description: |-
  Extended screen reading reduces natural blink rates by over 60%, breaking the tear film
  and causing ciliary muscle accommodation spasms (Digital Eye Strain).

  Vision 20-20-20 helps you adhere to the ophthalmologist-backed 20-20-20 rule:
  Every 20 minutes of screen work, look at an object 20 feet away for 20 seconds.

  Features:
  - Zero overlay clutter over your active apps during the 20-minute work session
  - 20-second calming guided breathing and eye rest overlay with auto-dismiss
  - Screen-aware mobile profile (pauses when phone is locked, natural break auto-reset)
  - Desk companion profile (continuous wall-clock countdown for laptop reading)
  - Lock-screen Google Clock-style alert delivery (setShowWhenLocked)
  - Quick Settings Tile and Jetpack Glance Home Screen Widget
  - 100% offline: android.permission.INTERNET is completely absent from the manifest
  - Free & Open Source Software under GNU General Public License v3.0

