AutoName: Vision 20-20-20
Summary: Scientific 20-20-20 eye wellness & digital strain reminder
Description: |-
  Vision 20-20-20 helps prevent Computer Vision Syndrome and digital asthenopia by
  encouraging you to follow the ophthalmologist-backed 20-20-20 rule: every 20 minutes
  of screen reading, look at an object 20 feet away for 20 seconds.

  Features:
  - Zero screen clutter or floating bubbles during the 20-minute working session
  - 20-second guided breathing & eye relaxation overlay with auto-dismiss
  - Mobile reading profile (pauses when screen is off, natural break auto-reset)
  - Laptop / desk companion profile (continuous wall-clock countdown)
  - Lock-screen Google Clock-style alert delivery (setShowWhenLocked)
  - Quick Settings Tile and Jetpack Glance Home Screen Widget
  - 100% offline, zero internet permissions, privacy-first

