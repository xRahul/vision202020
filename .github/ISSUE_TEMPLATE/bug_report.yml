---
name: Bug report
description: Report a reproducible defect in Vision 20-20-20.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here.
        Use the private advisory link in `SECURITY.md`.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the app's About/Settings screen.
      placeholder: "1.1.7 (versionCode 43)"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Android release and device model.
      placeholder: "Android 16, Pixel 7a"
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Install source
      options:
        - GitHub Releases
        - Obtainium
        - F-Droid
        - IzzyOnDroid
        - Built from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, in order.
      placeholder: |
        1. Open the app
        2. Start a session
        3. Turn the screen off
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logcat
    attributes:
      label: Logcat excerpt
      description: Optional. Redact device identifiers.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Optional. Drag files here.
