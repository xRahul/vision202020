name: Store Metadata Validation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-metadata
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Fastlane and F-Droid metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Fastlane Metadata
        run: |
          echo "=== Checking Fastlane Metadata ==="
          test -f fastlane/metadata/android/en-US/title.txt || (echo "Missing title.txt" && exit 1)
          test -f fastlane/metadata/android/en-US/short_description.txt || (echo "Missing short_description.txt" && exit 1)
          test -f fastlane/metadata/android/en-US/full_description.txt || (echo "Missing full_description.txt" && exit 1)
          test -f fastlane/metadata/android/en-US/images/icon.png || (echo "Missing icon.png" && exit 1)
          test -f fastlane/metadata/android/en-US/images/featureGraphic.png || (echo "Missing featureGraphic.png" && exit 1)

          SHORT_LEN=$(wc -m < fastlane/metadata/android/en-US/short_description.txt | tr -d ' ')
          echo "Short description length: $SHORT_LEN characters"
          if [ "$SHORT_LEN" -gt 80 ]; then
            echo "Error: short_description.txt exceeds 80 characters (current: $SHORT_LEN)"
            exit 1
          fi

          echo "Fastlane structure verified."

      - name: Validate F-Droid Recipe
        run: |
          echo "=== Checking F-Droid Metadata Recipe ==="
          python3 - <<'PY'
          import re
          import sys
          import yaml

          path = "metadata/in.rahulja.vision202020.yml"
          with open(path, "r", encoding="utf-8") as handle:
              data = yaml.safe_load(handle)

          valid_categories = {"Digital Wellbeing", "Timer", "Time Tracker"}
          categories = set(data.get("Categories", []))
          assert categories <= valid_categories, f"Invalid categories: {categories - valid_categories}"
          assert categories, "Categories must not be empty"

          assert data.get("License") == "GPL-3.0-or-later"
          assert data.get("AuthorName")
          assert data.get("SourceCode")
          assert data.get("AutoName")
          assert data.get("RepoType") == "git"
          assert data.get("AutoUpdateMode") == "Version"
          assert str(data.get("UpdateCheckMode", "")).startswith("Tags")
          assert data.get("UpdateCheckData", "").startswith("version.properties|versionCode=")

          builds = data.get("Builds", [])
          assert len(builds) == 1, "Only the latest build should be listed"
          build = builds[0]
          assert re.fullmatch(r"[0-9a-f]{40}", str(build.get("commit", ""))), "commit must be a full 40-char hash"
          assert build.get("subdir") == "app"

          current_version = str(data.get("CurrentVersion"))
          current_code = str(data.get("CurrentVersionCode"))
          assert build.get("versionName") == current_version
          assert str(build.get("versionCode")) == current_code

          assert "Summary" not in data, "Summary belongs in Fastlane"
          assert "Description" not in data, "Description belongs in Fastlane"

          print(f"Validated {data['AutoName']} v{current_version} (code: {current_code})")
          PY

      - name: Check Store Listings
        run: |
          for url in \
            "https://f-droid.org/packages/in.rahulja.vision202020/" \
            "https://apt.izzysoft.de/fdroid/index/apk/in.rahulja.vision202020"; do
            status=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "$url -> $status"
          done

      - name: Publish Validation Summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Store metadata validation

          - Fastlane title, short description, full description, icon, and feature graphic are present.
          - F-Droid recipe uses valid categories, a full commit hash, tag-based auto-update, and Fastlane-owned copy.
          - This workflow validates files only. Store submission is manual.
          - F-Droid requires 3 months of active development; earliest normal submission is 2027-02-17.
          - IzzyOnDroid requires a tagged, release-signed APK under 30 MB and a Fastlane listing.
          EOF
