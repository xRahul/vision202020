name: Build & Release Vision 20-20-20

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic Version Bump (Manual Run)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version and Tag (for Manual Dispatch)
        id: versioning
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "v1.0.0")
            CLEAN_VER="${LATEST_TAG#v}"
            CLEAN_VER="${CLEAN_VER%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            BUMP="${{ github.event.inputs.bump }}"
            if [[ "$BUMP" == "major" ]]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [[ "$BUMP" == "minor" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Computed new tag: $NEW_TAG"

            GIT_COUNT=$(git rev-list --count HEAD)
            VERSION_CODE=$((GIT_COUNT + 1))

            if [ -f "metadata/in.rahulja.vision202020.yml" ]; then
              python3 scripts/update_fdroid_metadata.py "$VERSION" "$VERSION_CODE" "$NEW_TAG"
            fi

            printf 'versionCode=%s\nversionName=%s\n' "$VERSION_CODE" "$VERSION" > version.properties

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add metadata/in.rahulja.vision202020.yml version.properties
            git commit -m "chore(release): bump version to $NEW_TAG [skip ci]" || true
            git push origin main
            sleep 2
            git tag -fa "$NEW_TAG" -m "Release $NEW_TAG"
            git push origin "$NEW_TAG" --force || (sleep 3 && git push origin "$NEW_TAG" --force)
            TAG_NAME="$NEW_TAG"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            # Reuse the code pinned by the dispatch build for this tag; the git count is
            # only a fallback for tags that predate version.properties.
            PINNED_CODE=$(git show "$TAG_NAME:version.properties" 2>/dev/null | sed -n 's/^versionCode=//p' | tr -d '\r')
            GIT_COUNT=$(git rev-list --count HEAD)
            VERSION_CODE="${PINNED_CODE:-$((GIT_COUNT + 1))}"
          fi
          echo "ORG_GRADLE_PROJECT_versionName=$VERSION" >> $GITHUB_ENV
          echo "ORG_GRADLE_PROJECT_versionCode=$VERSION_CODE" >> $GITHUB_ENV
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Setup Release Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.keystore
            echo "KEYSTORE_FILE=/tmp/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "ERROR: release keystore secrets are missing; refusing to publish an unsigned or self-signed release." >&2
            exit 1
          fi

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease lintDebug

      - name: Verify Release APK Is Signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "ERROR: $APK missing (unsigned build?)"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.versioning.outputs.version }}"
          # Single universal APK per variant: no native libs or raster assets, so
          # ABI/density splits would only duplicate identical files.
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/in.rahulja.vision202020-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/in.rahulja.vision202020-v${VERSION}-release.apk"
          ls -la artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: Vision 20-20-20 ${{ steps.versioning.outputs.tag_name }}
          draft: false
          prerelease: ${{ contains(steps.versioning.outputs.tag_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/in.rahulja.vision202020-*-debug.apk
            artifacts/in.rahulja.vision202020-*-release.apk
