name: Build & Release Vision 20-20-20

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic Version Bump (Manual Run)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version and Tag (for Manual Dispatch)
        id: versioning
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            CLEAN_VER="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            BUMP="${{ github.event.inputs.bump }}"
            if [[ "$BUMP" == "major" ]]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [[ "$BUMP" == "minor" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            echo "Computed new tag: $NEW_TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
            git push origin "$NEW_TAG"
            TAG_NAME="$NEW_TAG"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Setup Release Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.keystore
            echo "KEYSTORE_FILE=/tmp/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Warning: KEYSTORE_BASE64 secret not set. Generating CI self-signed release key..."
            keytool -genkeypair -alias visionkey -keypass android -keystore /tmp/keystore/release.keystore -storepass android -dname "CN=Vision202020,O=Vision,C=US" -validity 10000 -keyalg RSA -keysize 2048
            echo "KEYSTORE_FILE=/tmp/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=visionkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.versioning.outputs.version }}"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/vision202020-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/vision202020-v${VERSION}-release.apk"
          ls -la artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: Vision 20-20-20 ${{ steps.versioning.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/vision202020-*-debug.apk
            artifacts/vision202020-*-release.apk
