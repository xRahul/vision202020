name: Build & Release Vision 20-20-20

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic Version Bump (Manual Run)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve Version and Tag
        id: versioning
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git fetch origin main
            git checkout -B main origin/main

            LATEST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "v1.0.0")
            CLEAN_VER="${LATEST_TAG#v}"
            CLEAN_VER="${CLEAN_VER%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            if [[ "$BUMP" == "major" ]]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [[ "$BUMP" == "minor" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            VERSION="${MAJOR}.${MINOR}.${PATCH}"

            if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
              echo "ERROR: tag $NEW_TAG already exists; refusing to move it." >&2
              exit 1
            fi

            GIT_COUNT=$(git rev-list --count HEAD)
            VERSION_CODE=$((GIT_COUNT + 1))

            printf 'versionCode=%s\nversionName=%s\n' "$VERSION_CODE" "$VERSION" > version.properties

            mkdir -p fastlane/metadata/android/en-US/changelogs
            PREV_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || true)
            CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty='- %s' "$PREV_TAG..HEAD" > "$CHANGELOG"
            fi
            if [ ! -s "$CHANGELOG" ]; then
              printf -- '- Maintenance release.\n' > "$CHANGELOG"
            fi
            head -c 480 "$CHANGELOG" > "${CHANGELOG}.tmp"
            mv "${CHANGELOG}.tmp" "$CHANGELOG"

            git add version.properties "$CHANGELOG"
            git commit -m "chore(release): bump version to $NEW_TAG [skip ci]"

            RELEASE_SHA=$(git rev-parse HEAD)

            if [ -f "metadata/in.rahulja.vision202020.yml" ]; then
              python3 scripts/update_fdroid_metadata.py "$VERSION" "$VERSION_CODE" "$RELEASE_SHA"
              git add metadata/in.rahulja.vision202020.yml
              git commit -m "chore(fdroid): pin recipe to $RELEASE_SHA [skip ci]" || true
            fi

            TAG_SHA=$(git rev-parse HEAD)
            git push origin main

            git tag -a "$NEW_TAG" -m "Release $NEW_TAG" "$TAG_SHA"
            git push origin "$NEW_TAG"
            TAG_NAME="$NEW_TAG"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            RELEASE_SHA=$(git rev-parse HEAD)

            FILE_VER=$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')
            if [ "$FILE_VER" != "$VERSION" ]; then
              echo "ERROR: version.properties=$FILE_VER, tag=$VERSION" >&2
              exit 1
            fi

            PINNED_CODE=$(sed -n 's/^versionCode=//p' version.properties | tr -d '\r')
            GIT_COUNT=$(git rev-list --count HEAD)
            VERSION_CODE="${PINNED_CODE:-$((GIT_COUNT + 1))}"
          fi

          case "$VERSION_CODE" in
            ''|*[!0-9]*) echo "ERROR: invalid versionCode: $VERSION_CODE" >&2; exit 1 ;;
          esac

          echo "ORG_GRADLE_PROJECT_versionName=$VERSION" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_versionCode=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Setup Release Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.keystore
            echo "KEYSTORE_FILE=/tmp/keystore/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "ERROR: release keystore secrets are missing; refusing to publish an unsigned or self-signed release." >&2
            exit 1
          fi

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease lintDebug

      - name: Verify Release APK Is Signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "ERROR: $APK missing (unsigned build?)"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          EXPECTED=9ec14141874c3a8f2e3843f52582c311880fe5417eb6f097fdf8515db92f2511
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: signing key changed: $ACTUAL" >&2
            exit 1
          fi

      - name: Generate SBOM
        run: ./gradlew cyclonedxBom

      - name: Prepare Release Artifacts
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.versioning.outputs.version }}"
          APK="in.rahulja.vision202020-v${VERSION}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/$APK"
          cp app/build/reports/cyclonedx/bom.json "artifacts/in.rahulja.vision202020-v${VERSION}-bom.json"
          cd artifacts
          sha256sum "$APK" > "$APK.sha256"
          ls -la

      - name: Upload Debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign Checksum
        run: |
          cd artifacts
          CHECKSUM=$(ls *.apk.sha256)
          cosign sign-blob --yes --bundle "${CHECKSUM}.sigstore.json" "$CHECKSUM"
          ls -la

      - name: Attest Release APK
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/in.rahulja.vision202020-v${{ steps.versioning.outputs.version }}-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: Vision 20-20-20 ${{ steps.versioning.outputs.tag_name }}
          draft: false
          prerelease: ${{ contains(steps.versioning.outputs.tag_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*-release.apk
            artifacts/*-release.apk.sha256
            artifacts/*-bom.json
            artifacts/*.sigstore.json
